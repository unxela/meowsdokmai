</head>

    <main class="letter-content">

        </div>

        <div class="input-section">
            <label for="long-msg">เขียนจดหมายถึงเขากัน</label>
            <textarea id="long-msg" class="large-textarea" placeholder="ลองบอกอะไรสักอย่างดู..."></textarea>
        </div>

        <div class="bottom-actions">
            <button class="back-btn" onclick="window.location.href='message.html'">&larr; ย้อนกลับ</button>
            <button class="next-step-btn" onclick="goToSharePage()">ไปต่อ &rarr;</button>
