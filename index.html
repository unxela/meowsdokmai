<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DokMai - ส่งของขวัญให้คนที่รัก</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    
    <!--
    <header class="top-nav">
        <div class="menu-icon">
            <svg viewBox="0 0 24 24" width="32" height="32" stroke="#5C7CB4" stroke-width="2" fill="none">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </div>
    </header>
    -->

    <main class="hero-section">
        <h1 class="logo-text">MeowDokMai</h1>
        <h2 class="subtitle">ส่งของขวัญให้คนที่รัก</h2>
        
        <div class="image-wrapper">
            <img src="images/cat.png" onerror="this.onerror=null; this.src='cat.png';" alt="Cat Sketch" class="center-image">
        </div>

        <p class="dummy-text">
            สร้างช่อดอกไม้ออนไลน์และเขียนจดหมายให้คนที่รัก<br>
            ส่งความรักผ่านดอกไม้และคำพูดที่อบอุ่นใจ<br>
        </p>

<button class="start-button" onclick="window.location.href='donate.html'">เริ่มจัดดอกไม้กันเลย!</button>
    </main>

    <!-- ส่วนแสดงผลสำหรับผู้รับจดหมาย (จะแสดงเมื่อมีข้อมูลในลิงก์) -->
    <main id="receiver-view" class="hero-section" style="display: none;">
        <h1 class="logo-text">MeowDokMai</h1>
        <h2 class="subtitle" id="display-to" style="margin-top: 10px;">มีของขวัญส่งถึงคุณ 🌸</h2>
        <div class="image-wrapper">
            <img src="images/cat.png" onerror="this.onerror=null; this.src='cat.png';" alt="Cat Sketch" class="center-image">
        </div>
        <p class="dummy-text" id="display-msg" style="white-space: pre-wrap; font-size: 1.1rem; color: #333;"></p>
        <button class="start-button" onclick="window.location.href='index.html'">สร้างของขวัญของคุณบ้าง</button>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // ตรวจสอบข้อมูลที่แนบมากับ URL
            const params = new URLSearchParams(window.location.search);
            const to = params.get('to');
            const msg = params.get('msg');

            // ถ้ามีพารามิเตอร์ ถือว่าคนเปิดคือ "ผู้รับ"
            if (to || msg) {
                // ซ่อนหน้าหลัก แล้วแสดงหน้าจดหมายแทน
                document.querySelector('.hero-section').style.display = 'none';
                document.getElementById('receiver-view').style.display = 'block';
                
                if (to) document.getElementById('display-to').textContent = `ถึง: ${to} 🌸`;
                if (msg) document.getElementById('display-msg').textContent = msg;
            }
        });
    </script>

</body>
</html>
